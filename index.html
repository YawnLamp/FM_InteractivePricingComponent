<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Interactive pricing component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="layout.css" />
  </head>
  <body>
    <div class="main-wrapper">
      <div class="header">
        <h1>Simple, traffic-based pricing</h1>
        <p>Sign-up for our 30-day trial. No credit card required.</p>
      </div>
      <div class="main-card">
        Pageviews $ /month Monthly Billing Yearly Billing 25% discount

        <p><img src="images/icon-check.svg" alt="" />Unlimited websites</p>
        <p>
          <img src="images/icon-check.svg" alt="checkmark" />100% data ownership
        </p>
        <p><img src="images/icon-check.svg" alt="checkmark" />Email reports</p>

        <button>Start my trial</button>
      </div>
    </div>
  </body>
</html>
